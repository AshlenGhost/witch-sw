<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Royal Courier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: playful court intrigue between two friends, quick and readable on a phone.
   IDEA: a wine-velvet card table with ivory court cards and gold wax seals as points.
   PICTURE: the table itself (rival, deck, your hand); home shows a sealed letter over fanned cards.
   COLOUR and TYPE: wine felt, ivory cards, gold seal accent; Cinzel for names, Inter for text.
   LAYOUT: one phone-width column: rival, deck strip, news, your hand, actions. */
:root{color-scheme:light dark;--bg:light-dark(#f6edf0,#14070e);--ink:light-dark(#2b0f1c,#f6e8ee);--soft:light-dark(#7a5a68,#c9a9b6);--line:light-dark(#e6d3da,#3a1828);--panel:light-dark(#fff,#1f0c16);--felt:light-dark(#6e1a38,#3f0d22);--felt2:light-dark(#57122b,#2c0817);--fink:#fdf1f5;--fsoft:#e7bccb;--card:#fffaf6;--cink:#2b0f1c;--gold:#f3bd48;--gold2:#c98d16}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3,.cz{font-family:Cinzel,Georgia,serif;font-weight:700;line-height:1.05;margin:0;text-wrap:balance}
button{font:inherit;cursor:pointer}
.btn{min-height:44px;padding:10px 18px;border-radius:12px;border:0;background:var(--gold);color:#2b0f1c;font-weight:700;font-size:16px}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor}
.btn.sm{min-height:40px;padding:8px 14px;font-size:15px}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input{font:inherit;font-size:16px;min-height:44px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);width:100%}
.wrap{max-width:760px;margin:0 auto;padding:0 max(4vw,14px)}
.hero{background:var(--felt);color:var(--fink);padding:28px 0 8px}
.hero .wrap{display:grid;gap:8px}
.hero h1{font-size:clamp(36px,9vw,52px)}
.hero p{margin:0;color:var(--fsoft);max-width:34em}
.fig{position:relative;height:min(58vw,300px)}
.fig svg{position:absolute;inset:0;width:100%;height:100%}
.sec{padding:22px 0;border-bottom:1px solid var(--line)}
.sec h2{font-size:22px;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>input{flex:1 1 180px}
.note{font-size:14px;color:var(--soft);margin:8px 0 0}
.err{color:light-dark(#b0123b,#ff8fa9);font-weight:600}
.list{display:grid;gap:8px;margin-top:12px}
.tb{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1.5px solid var(--line);border-radius:14px;background:var(--panel)}
.tb b{font-family:Cinzel;letter-spacing:.04em}
.tb span{flex:1;font-size:14px;color:var(--soft)}
details summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}
.ref{display:grid;gap:8px;margin-top:6px}
.ref div{display:grid;grid-template-columns:38px 1fr;gap:10px;align-items:start;font-size:15px}
/* table */
.table{background:var(--felt);color:var(--fink);min-height:100vh;padding-bottom:40px}
.top{display:flex;align-items:center;gap:10px;padding:10px 0}
.top .cz{flex:1;font-size:15px;color:var(--fsoft)}
.zone{display:grid;gap:8px;padding:12px 0}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who h3{font-size:19px}
.chip{font-size:13px;font-weight:700;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.14)}
.chip.gold{background:var(--gold);color:#2b0f1c}
.chip.bad{background:#ff6f8f;color:#2b0f1c}
.seals{display:flex;gap:4px;margin-left:auto}
.seal{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.3)}
.seal.on{background:radial-gradient(circle at 35% 30%,#ffe29a,var(--gold) 45%,var(--gold2));box-shadow:0 1px 2px rgba(0,0,0,.4)}
.backs{display:flex;gap:8px}
.disc{display:flex;gap:5px;flex-wrap:wrap;min-height:44px;align-items:center}
.disc .lbl{font-size:13px;color:var(--fsoft);margin-right:4px}
.mid{display:flex;gap:16px;align-items:flex-end;padding:14px 12px;background:var(--felt2);border-radius:16px;flex-wrap:wrap}
.mid .lbl{font-size:13px;color:var(--fsoft);display:block;margin-top:4px}
.stack{position:relative}
.count{position:absolute;right:-8px;top:-8px;background:var(--gold);color:#2b0f1c;font-weight:800;font-size:13px;border-radius:99px;padding:1px 7px}
.news{margin:12px 0 0;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.1);font-size:15px;min-height:48px}
.news.fresh{animation:pop .5s ease}
@keyframes pop{from{background:rgba(243,189,72,.55)}to{background:rgba(255,255,255,.1)}}
.hand{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:12px;max-width:300px}
.hand.three{max-width:440px}
.act{margin-top:14px;padding:14px;border-radius:16px;background:var(--card);color:var(--cink)}
.act h3{font-size:19px;margin-bottom:4px}
.act p{margin:4px 0 10px;font-size:15px}
.act .warn{color:#b0123b;font-weight:600}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:6px;margin-bottom:12px}
.pk{min-height:44px;border-radius:10px;border:1.5px solid #e2cdd5;background:#fff;color:var(--cink);font-size:14px;font-weight:600;padding:4px 6px}
.pk.on{background:var(--cink);color:#fff;border-color:var(--cink)}
.pk:disabled{opacity:.4}
.act .btn{background:var(--felt);color:#fff}
.act .btn.ghost{background:transparent;color:var(--cink)}
.log{margin-top:16px}
.log ol{margin:6px 0 0;padding-left:20px;font-size:14px;color:var(--fsoft);display:grid;gap:4px}
/* cards */
.card{--t:#555;position:relative;width:100%;aspect-ratio:5/7;border-radius:12px;background:var(--card);color:var(--cink);display:flex;flex-direction:column;padding:8px 9px;border:0;text-align:left;box-shadow:0 2px 0 rgba(0,0,0,.18),0 12px 22px rgba(0,0,0,.3);transition:transform .15s}
.card .v{font-family:Cinzel;font-size:30px;font-weight:700;color:var(--t);line-height:1}
.card .n{font-family:Cinzel;font-weight:700;font-size:15px;margin-top:2px}
.card .art{flex:1;display:grid;place-items:center;padding:4px 0}
.card .art svg{width:62%;max-width:96px;height:auto}
.card .tx{font-size:13px;line-height:1.25;color:#5b4450}
.card.on{transform:translateY(-10px);box-shadow:0 0 0 3px var(--gold),0 16px 28px rgba(0,0,0,.4)}
.card:disabled{cursor:default}
.card.no{opacity:.5}
.card.keep{box-shadow:0 0 0 3px var(--gold),0 12px 22px rgba(0,0,0,.3)}
.back{width:54px;aspect-ratio:5/7;border-radius:8px;background:var(--felt2);box-shadow:inset 0 0 0 2px var(--gold2),0 6px 12px rgba(0,0,0,.35);display:grid;place-items:center}
.back i{width:40%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe29a,var(--gold) 45%,var(--gold2))}
.mini{width:36px;height:50px;border-radius:7px;background:var(--card);color:var(--t);display:grid;place-items:center;font:700 19px Cinzel,serif;box-shadow:inset 0 -5px 0 var(--t),0 3px 6px rgba(0,0,0,.3)}
.sheet{position:fixed;inset:auto 0 0 0;z-index:5;background:var(--card);color:var(--cink);border-radius:22px 22px 0 0;padding:20px max(4vw,16px) 24px;box-shadow:0 -14px 40px rgba(0,0,0,.45);max-height:86vh;overflow:auto}
.sheet .in{max-width:620px;margin:0 auto;display:grid;gap:12px}
.sheet h2{font-size:clamp(26px,7vw,36px)}
.res{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.res>div{display:grid;gap:6px;justify-items:start;align-content:start}
.res .card{max-width:120px}
.res .card .tx{display:none}
.big{font-family:Cinzel;font-size:clamp(40px,12vw,64px);letter-spacing:.12em;color:var(--gold)}
@media(max-width:600px){.card .n{font-size:14px}.card .v{font-size:26px}.mid{gap:12px}}
@media(prefers-reduced-motion:reduce){.news.fresh{animation:none}.card{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
{
/*LOGIC-START*/
const V=[
 {n:'Spy',c:2,s:'Lone spy at round end: +1 seal',t:'No effect when played. At the end of the round, if you are the only player still in who played or discarded a Spy, you gain a bonus seal.',col:'#4a5568'},
 {n:'Guard',c:6,s:'Guess your rival’s card',t:'Name any card except Guard. If your rival is holding it, they are out of the round.',col:'#2f6db0'},
 {n:'Priest',c:2,s:'Peek at your rival’s card',t:'Secretly look at the card in your rival’s hand.',col:'#1f8a80'},
 {n:'Baron',c:2,s:'Duel: the lower card is out',t:'Compare the card you keep with your rival’s card. The lower one is out of the round. A tie does nothing.',col:'#8a5a2b'},
 {n:'Handmaid',c:2,s:'Protected until your next turn',t:'Until your next turn, your rival’s cards cannot affect you.',col:'#c0507a'},
 {n:'Prince',c:2,s:'A hand is discarded and redrawn',t:'Choose yourself or your rival. That player discards their card (no effect, except the Princess knocks them out) and draws a new one.',col:'#3d55c2'},
 {n:'Chancellor',c:2,s:'Draw 2, keep 1, bury 2',t:'Draw 2 cards. Keep one of your cards and put the other 2 on the bottom of the deck in the order you choose.',col:'#6c46a6'},
 {n:'King',c:1,s:'Swap hands',t:'Trade the card you keep with your rival’s card.',col:'#a8790a'},
 {n:'Countess',c:1,s:'Must play with King or Prince',t:'No effect. But if you hold her together with the King or a Prince, you must play her.',col:'#a3265a'},
 {n:'Princess',c:1,s:'Lose her and you’re out',t:'If you play or discard the Princess for any reason, you are out of the round.',col:'#d2335f'}
];
const rnd=n=>Math.floor(Math.random()*n);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function fullDeck(){const d=[];V.forEach((x,v)=>{for(let k=0;k<x.c;k++)d.push(v)});return shuffle(d)}
const clone=o=>JSON.parse(JSON.stringify(o));
function newGame(code,p0){return{v:0,code,players:[p0,null],seals:[0,0],goal:6,round:0,phase:'lobby',deck:[],aside:null,faceUp:[],hands:[[],[]],disc:[[],[]],out:[false,false],prot:[false,false],turn:0,result:null,log:[],seq:0,updated:0}}
function addLog(s,e){e.n=++s.seq;e.r=s.round;s.log.push(e);if(s.log.length>60)s.log.splice(0,s.log.length-60)}
function startRound(s,first){
 const d=fullDeck();
 s.round++;s.aside=d.pop();s.faceUp=[d.pop(),d.pop(),d.pop()];
 s.hands=[[d.pop()],[d.pop()]];s.disc=[[],[]];s.out=[false,false];s.prot=[false,false];
 s.deck=d;s.turn=first;s.result=null;s.phase='turn';
 s.hands[first].push(s.deck.pop());
 addLog(s,{k:'start',a:first});
}
function legal(s,i){const h=s.hands[i];if(h.includes(8)&&(h.includes(7)||h.includes(5)))return[h.indexOf(8)];return h.map((c,k)=>k)}
function knock(s,t){s.out[t]=true;s.disc[t].push(...s.hands[t]);s.hands[t]=[]}
function draw(s,t){if(s.deck.length)s.hands[t].push(s.deck.pop());else if(s.aside!=null){s.hands[t].push(s.aside);s.aside=null}}
function play(s0,i,k,o){
 o=o||{};
 if(!s0||s0.phase!=='turn'||s0.turn!==i||!legal(s0,i).includes(k))return null;
 const s=clone(s0),r=1-i,open=!s.out[r]&&!s.prot[r];
 const c=s.hands[i].splice(k,1)[0];s.disc[i].push(c);
 const e={k:'play',a:i,b:r,c};
 if([1,2,3,7].includes(c)&&!open)e.blocked=true;
 else switch(c){
  case 1:{const g=o.guess;if(!(Number.isInteger(g)&&g>=0&&g<=9&&g!==1))return null;e.g=g;e.hit=s.hands[r][0]===g;if(e.hit)knock(s,r);break}
  case 2:e.seen=s.hands[r][0];break;
  case 3:{const x=s.hands[i][0],y=s.hands[r][0];e.x=x;e.y=y;if(x!==y){e.lose=x<y?i:r;knock(s,e.lose)}break}
  case 4:s.prot[i]=true;break;
  case 5:{const t=(o.target==='opp'&&open)?r:i;e.b=t;const d=s.hands[t].pop();e.d=d;s.disc[t].push(d);if(d===9){e.hit=true;knock(s,t)}else draw(s,t);break}
  case 6:{const n=Math.min(2,s.deck.length);e.drew=n;for(let q=0;q<n;q++)s.hands[i].push(s.deck.pop());if(n){s.phase='chan';addLog(s,e);return s}break}
  case 7:{const h=s.hands[i];s.hands[i]=s.hands[r];s.hands[r]=h;break}
  case 9:knock(s,i);break;
 }
 addLog(s,e);endTurn(s);return s;
}
function chanKeep(s0,i,k,order){
 if(!s0||s0.phase!=='chan'||s0.turn!==i)return null;
 const h=s0.hands[i];if(!(Number.isInteger(k)&&k>=0&&k<h.length))return null;
 let rest=h.map((_,j)=>j).filter(j=>j!==k);
 if(Array.isArray(order)&&order.length===rest.length&&order.every(j=>rest.includes(j))&&new Set(order).size===order.length)rest=order;
 const s=clone(s0),back=rest.map(j=>h[j]);
 s.deck.unshift(...back.slice().reverse());
 s.hands[i]=[h[k]];s.phase='turn';addLog(s,{k:'chanKeep',a:i,n:back.length});endTurn(s);return s;
}
function endTurn(s){
 const alive=[0,1].filter(x=>!s.out[x]);
 if(alive.length===1)return endRound(s,alive,'last');
 if(!s.deck.length){const top=Math.max(...alive.map(x=>s.hands[x][0]));return endRound(s,alive.filter(x=>s.hands[x][0]===top),'deck',top)}
 const n=1-s.turn;s.prot[n]=false;s.turn=n;draw(s,n);
}
function endRound(s,w,why,top){
 const alive=[0,1].filter(x=>!s.out[x]),spies=alive.filter(x=>s.disc[x].includes(0)),spy=spies.length===1?spies[0]:null;
 w.forEach(x=>s.seals[x]++);if(spy!=null)s.seals[spy]++;
 s.result={w,why,spy,top:top==null?null:top,first:w[rnd(w.length)],hands:clone(s.hands),out:s.out.slice()};
 s.phase=s.seals.some(x=>x>=s.goal)?'over':'done';
 addLog(s,{k:'end',w,why,spy,top:top==null?null:top});
}
function nextRound(s0){if(!s0||s0.phase!=='done')return null;const s=clone(s0);startRound(s,s.result.first);return s}
function rematch(s0){if(!s0||s0.phase!=='over')return null;const s=clone(s0);s.seals=[0,0];s.round=0;startRound(s,rnd(2));return s}
function botMove(s,i){
 const h=s.hands[i];
 if(s.phase==='chan'){const k=h.indexOf(Math.max(...h));return chanKeep(s,i,k)}
 const r=1-i,L=legal(s,i);
 const seen=[...h,...s.disc[0],...s.disc[1],...s.faceUp];
 const left=V.map((x,v)=>x.c-seen.filter(c=>c===v).length);
 let known=null;
 for(const e of s.log){
  if(e.r!==s.round)continue;
  if(e.k==='chanKeep'){if(e.a===r)known=null;continue}
  if(e.k!=='play')continue;
  if(e.a===i&&e.c===2&&!e.blocked){known=e.seen;continue}
  if(known==null)continue;
  if(e.a===r&&(e.c===known||e.c===6||e.c===7||(e.c===5&&e.b===r)))known=null;
  else if(e.a===i&&(e.c===7||(e.c===5&&e.b===r)))known=null;
 }
 const opts=L.map(k=>{const c=h[k],keep=h[1-k];let sc=keep;
  if(c===9)sc-=100;
  if(c===3)sc+=known!=null?(keep>known?20:-20):(keep>=5?4:-6);
  if(c===1&&known!=null&&known!==1)sc+=20;
  if(c===4)sc+=1;
  if(c===7&&keep<=3)sc+=2;
  return{k,sc:sc+Math.random()*.5}});
 opts.sort((a,b)=>b.sc-a.sc);
 const k=opts[0].k,c=h[k],o={target:'opp'};
 if(c===1){let g=known!=null&&known!==1?known:-1;if(g<0){left.forEach((n,v)=>{if(v!==1&&n>0&&(g<0||n>left[g]||(n===left[g]&&v>g)))g=v});if(g<0)g=0}o.guess=g}
 return play(s,i,k,o);
}
/*LOGIC-END*/

const app=document.getElementById('app');
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const esc=x=>String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let myId=store.get('rc-id');if(!myId){myId='p'+Math.random().toString(36).slice(2,12);store.set('rc-id',myId)}
let myName=store.get('rc-name')||'';
let S=null,me=0,net=null,env='detect',netMsg='',homeMsg='',canWrite=null,tables=[],listState='wait';
let ui={screen:'home',sel:null,guess:null,tgt:'opp',keep:null,order:null,code:''};
let lastNews=0,botTimer=null;
const ICON=[
 '<path d="M6 21c5-7 13-7 18-2 5-5 13-5 18 2-2 9-11 12-18 5-7 7-16 4-18-5z"/><circle cx="15" cy="22" r="3" fill="var(--t)"/><circle cx="33" cy="22" r="3" fill="var(--t)"/>',
 '<path d="M24 6l15 5v11c0 10-6 16-15 20-9-4-15-10-15-20V11z"/><path d="M24 13v22M16 22h16" stroke="var(--t)" stroke-width="3"/>',
 '<path d="M24 5c5 6 5 10 0 13-5-3-5-7 0-13z"/><rect x="18" y="20" width="12" height="18" rx="2"/><rect x="12" y="38" width="24" height="5" rx="2"/>',
 '<path d="M24 8v28M12 14h24M12 14l-6 12M12 14l6 12M36 14l-6 12M36 14l6 12" stroke="#fff" stroke-width="2.5" fill="none"/><path d="M5 26h14a7 5 0 0 1-14 0zM29 26h14a7 5 0 0 1-14 0zM15 38h18v4H15z"/>',
 '<circle cx="24" cy="14" r="7"/><circle cx="34" cy="21" r="7"/><circle cx="30" cy="32" r="7"/><circle cx="18" cy="32" r="7"/><circle cx="14" cy="21" r="7"/><circle cx="24" cy="23" r="5" fill="var(--t)"/>',
 '<path d="M24 4l4 7v19h-8V11z"/><rect x="13" y="30" width="22" height="4" rx="2"/><rect x="21.5" y="34" width="5" height="8"/><circle cx="24" cy="44" r="2.5"/>',
 '<rect x="12" y="10" width="24" height="28" rx="2"/><rect x="9" y="6" width="30" height="7" rx="3.5"/><rect x="9" y="35" width="30" height="7" rx="3.5"/><path d="M17 19h14M17 24h14M17 29h9" stroke="var(--t)" stroke-width="2.5"/>',
 '<path d="M8 34l-2-20 10 8 8-13 8 13 10-8-2 20z"/><rect x="8" y="36" width="32" height="5" rx="2"/><circle cx="24" cy="27" r="3" fill="var(--t)"/>',
 '<path d="M24 40L7 21a24 24 0 0 1 34 0z"/><path d="M24 40L12 16M24 40l-5-27M24 40l5-27M24 40l12-24" stroke="var(--t)" stroke-width="2"/><circle cx="24" cy="40" r="3"/>',
 '<path d="M9 34l3-15 7 7 5-15 5 15 7-7 3 15z"/><rect x="9" y="35" width="30" height="5" rx="2"/><circle cx="24" cy="25" r="3.5" fill="var(--t)"/><circle cx="12" cy="18" r="2.5"/><circle cx="36" cy="18" r="2.5"/><circle cx="24" cy="10" r="2.5"/>'
];
const art=v=>`<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="24" fill="${V[v].col}"/><g fill="#fff" transform="translate(4.8 4.8) scale(.8)">${ICON[v]}</g></svg>`;
function card(v,attrs,cls){return`<button class="card ${cls||''}" style="--t:${V[v].col}" ${attrs||''}><span class="v">${v}</span><span class="n">${V[v].n}</span><span class="art">${art(v)}</span><span class="tx">${V[v].s}</span></button>`}
const mini=v=>`<span class="mini" style="--t:${V[v].col}" title="${V[v].n}" aria-label="${V[v].n} (${v})">${v}</span>`;
const back=()=>'<span class="back"><i></i></span>';
const nm=i=>(S&&S.players[i]&&S.players[i].name)||(i?'Player 2':'Player 1');
const N=i=>i===me?'You':esc(nm(i));
const O=i=>i===me?'you':esc(nm(i));
const be=i=>i===me?'are':'is';
const C=v=>`${V[v].n} (${v})`;
function say(e){
 const pl=e.k==='play'?`${N(e.a)} played the ${V[e.c].n}`:'';
 switch(e.k){

 host(){homeMsg='';if(env==='db')dbHost();else peerHost()},
 join(b){if(env==='db')dbJoin(b.dataset.c)},
 resume(b){dbJoin(b.dataset.c)},
 joincode(){const c=(document.getElementById('code').value||'').toUpperCase().replace(/[^A-Z]/g,'');ui.code=c;if(c.length<4){homeMsg='Type the 4-letter code from your friend.';return render()}if(env==='db')dbJoin(c);else peerJoin(c)},
 sel(b){ui.sel=+b.dataset.k;ui.guess=null;ui.tgt='opp';render()},
 unsel(){resetSel();render()},
 guess(b){ui.guess=+b.dataset.v;render()},
 tgt(b){ui.tgt=b.dataset.t;render()},
 play(){const ns=play(S,me,ui.sel,{guess:ui.guess,target:ui.tgt});if(ns)commit(ns)},
 keep(b){const k=+b.dataset.k;ui.keep=k;ui.order=S.hands[me].map((_,j)=>j).filter(j=>j!==k);render()},
 swap(){if(ui.order)ui.order.reverse();render()},
 chanok(){const ns=chanKeep(S,me,ui.keep,ui.order);if(ns)commit(ns)},
 next(){commit(nextRound(S))},
 rematch(){commit(rematch(S))},
 leave(){leave()},
 reconnect(){if(peerCode)peerJoin(peerCode)},
 copy(b){const t=S&&S.code;try{navigator.clipboard.writeText(t).then(()=>{b.textContent='Copied'},()=>{b.textContent=t})}catch(e){b.textContent=t}}
};
app.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const f=H[b.dataset.a];if(f)f(b)});
app.addEventListener('input',e=>{if(e.target.id==='name'){myName=e.target.value;store.set('rc-name',myName)}if(e.target.id==='code')ui.code=e.target.value});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='code')H.joincode()});

/* ---- start ---- */
render();
(async()=>{
 let tries=0;while(!(window.claude&&typeof window.claude.use==='function')&&tries<8){await new Promise(r=>setTimeout(r,200));tries++}
 if(window.claude&&typeof window.claude.use==='function'){
  let to;const timeout=new Promise(r=>{to=setTimeout(()=>r(null),10000)});
  try{DB=await Promise.race([window.claude.use('db'),timeout])}catch(e){DB=null}
  clearTimeout(to);
  if(!DB){env='none';return render()}
  env='db';
  try{const U=await window.claude.use('user');if(U){const id=await U.id();if(id)myId=String(id);canWrite=await U.can('data.write')}}catch(e){}
  const lt=setTimeout(()=>{if(listState==='wait'){listState='err';if(ui.screen==='home')render()}},10000);
  DB.collection('tables').orderBy('updated','desc').limit(30).onSnapshot(sn=>{clearTimeout(lt);const wk=Date.now()-7*864e5;tables=sn.docs.map(d=>d.data()).filter(t=>t&&t.updated>wk);listState='ok';if(ui.screen==='home')render()},()=>{clearTimeout(lt);listState='err';if(ui.screen==='home')render()});
  render();
 }else{env='peer';render()}
})();
}
</script>
